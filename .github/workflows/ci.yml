name: CI

# Ported from `.circleci/config.yml`, which ran the same three steps against
# the two Node versions the packages claim to support.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      # The two versions are independent checks -- one failing says nothing
      # about the other, and knowing whether a break is version-specific is
      # most of the reason to run both.
      fail-fast: false
      matrix:
        node:
          - "16.19.1" # .nvmrc
          - "18.14.1"

    steps:
      - uses: actions/checkout@v7

      # `cache: yarn` caches the yarn cache directory rather than
      # `node_modules`, which is what CircleCI keyed on the lockfile. The
      # install still runs; it just stops re-fetching every tarball.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install
        run: yarn --frozen-lockfile

      # Ubuntu 24.04 -- which `ubuntu-latest` now is -- ships an AppArmor
      # profile denying unprivileged user namespaces, and Chromium builds its
      # sandbox out of one. Without this the examples build dies on "No usable
      # sandbox!". Re-permitting the namespace keeps that sandbox switched on,
      # which passing `--no-sandbox` would not; CircleCI's `-browsers` images
      # never needed either.
      - name: Allow Chromium to build its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Lint
        run: yarn run lint
        env:
          TERM: xterm

      # Builds every package, `@swirly/examples` included, which starts the
      # rasterization server and drives Chromium through Puppeteer. That is
      # why CircleCI used the `-browsers` images.
      - name: Build
        run: yarn run build

      - name: Test
        run: yarn run test:golden
